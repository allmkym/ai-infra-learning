name: Temporary CS106L 2026 material finalization

on:
  push:
    branches:
      - cs106l-material-import-20260923
    paths:
      - .github/workflows/_temp_import_cs106l_2026.yml
      - .github/scripts/_temp_import_cs106l_2026.py

permissions:
  contents: write

jobs:
  finalize-materials:
    runs-on: ubuntu-latest
    steps:
      - name: Check out temporary branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preserve finalization script
        run: cp .github/scripts/_temp_import_cs106l_2026.py /tmp/finalize_cs106l.py

      - name: Switch to latest remote main
        run: |
          git fetch origin main
          git checkout -B finalize-main origin/main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install extraction dependencies
        run: |
          python -m pip install --disable-pip-version-check pypdf==5.9.0
          if ! command -v tesseract >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y tesseract-ocr
          fi
          tesseract --version | head -1

      - name: Generate fallback text and patch indices
        run: python /tmp/finalize_cs106l.py

      - name: Validate change scope and commit
        run: |
          set -euo pipefail
          allowed='^(HANDOFF\.md|records/stage-01-preparation\.md|materials/cs106l/2026-spring/(README\.md|manifest\.json|2026Spring-05-Containers\.md|2026Spring-11-LambdasAndFunctors\.md))$'
          changed="$(git status --short | sed -E 's/^.. //')"
          printf '%s\n' "$changed"
          test -n "$changed"
          if printf '%s\n' "$changed" | grep -Ev "$allowed"; then
            echo "Unexpected changed path" >&2
            exit 1
          fi
          grep -q '^HANDOFF_END: ' HANDOFF.md
          git add HANDOFF.md records/stage-01-preparation.md materials/cs106l/2026-spring/README.md materials/cs106l/2026-spring/manifest.json materials/cs106l/2026-spring/2026Spring-05-Containers.md materials/cs106l/2026-spring/2026Spring-11-LambdasAndFunctors.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Complete CS106L Spring 2026 Lecture 5 and 11 fallback materials"

      - name: Recheck main and push without force
        run: |
          set -euo pipefail
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
